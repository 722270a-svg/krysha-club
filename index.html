</style></head><body><aside class="side" id="side"><div class="brand">КРЫША</div><p class="muted">Рестобар · Якутск</p><nav id="nav"></nav></aside><div class="shade" id="shade" onclick="toggle(false)"></div><div class="app"><header class="header"><button class="iconBtn" onclick="toggle(true)" aria-label="Открыть меню">☰</button><div class="brand">КРЫША</div><button class="iconBtn" onclick="page('profile')" aria-label="Личный кабинет">♙</button></header><main id="view"></main><footer>КРЫША · Якутск, ул. Кальвица, 14/1а, 4 этаж<br><a href="tel:+79247660106">+7 (924) 766-01-06</a><div class="list"><a href="https://vk.com/krysha_ykt" target="_blank" rel="noopener">ВКонтакте ↗</a><a href="https://t.me/krysha_ykt" target="_blank" rel="noopener">Telegram ↗</a><a href="https://instagram.com/krysha_ykt/" target="_blank" rel="noopener">Instagram ↗</a></div><p>Информационная тестовая версия, не официальный канал приёма заказов.</p></footer></div><div class="bar"><button onclick="page('home')">⌂ Главная</button><button onclick="page('events')">▦ Афиша</button><button onclick="page('menu')">☷ Меню</button><button onclick="page('booking')">▤ Бронь</button></div><script>
const sections=[['home','⌂','Главная'],['news','✦','Новости'],['sales','%','Акции'],['calendar','▦','Календарь мероприятий'],['menu','☷','Меню'],['events','★','Афиши'],['profile','♙','Личный кабинет'],['gallery','▧','Фотогалерея событий'],['radio','♫','Радио Крыша'],['residents','♬','Резиденты клуба'],['rules','ⓘ','Регламент клуба'],['booking','▤','Забронировать столик'],['signup','✓','Регистрация на мероприятие'],['contacts','☎','Контакты']];
const menus=sections.map(([id,ico,name])=>'<button class="nav" onclick="page(\''+id+'\')">'+ico+' &nbsp;'+name+'</button>').join('');document.getElementById('nav').innerHTML=menus;
function toggle(v){document.getElementById('side').classList.toggle('open',v);document.getElementById('shade').classList.toggle('open',v)}
const box=(title,body)=>'<article class="panel"><h3>'+title+'</h3>'+body+'</article>';
const tile=(id,ico,title,desc)=>'<button class="tile" onclick="page(\''+id+'\')"><span style="font-size:25px">'+ico+'</span><strong>'+title+'</strong><small>'+desc+'</small></button>';
const go=(url,txt)=>'<a class="btn" href="'+url+'" target="_blank" rel="noopener">'+txt+'</a>';
const call=go('tel:+79247660106','Позвонить в клуб');
let pages={
home:()=>'<div class="hero"><div class="eyebrow">Рестобар и ночной клуб · Якутск</div><h1>ТВОЙ ВЕЧЕР<br>НА КРЫШЕ</h1><p>Афиша, музыка, встречи и любимые события</p><button class="btn" onclick="page(\'events\')">Смотреть афишу</button></div><section class="section"><h2>Новости клуба</h2>'+box('Следи за новостями «Крыши»','<p class="muted">Актуальные публикации клуба доступны в официальном сообществе. Автоматическая синхронизация новостей будет подключена после согласования с администрацией.</p>'+go('https://vk.com/krysha_ykt','Новости в VK'))+'</section><section class="section"><h2>Для тебя</h2><div class="grid">'+tile('events','★','Афиша','Вечеринки и выступления')+tile('booking','▤','Бронь','Связаться с клубом')+tile('menu','☷','Меню','Блюда и напитки')+tile('sales','%','Акции','Предложения клуба')+tile('radio','♫','Радио','Музыка и DJ-сеты')+tile('profile','♙','Кабинет','Твои планы')+'</div></section>',
news:()=>box('Новости','<p>Официальные объявления и последние публикации клуба:</p>'+go('https://vk.com/krysha_ykt','Читать новости')),
sales:()=>box('Акции и специальные предложения','<p class="muted">Проверяй действующие предложения в каналах клуба. Неподтверждённые акции здесь не публикуются.</p>'+go('https://t.me/krysha_ykt','Смотреть акции')),
calendar:()=>box('Календарь мероприятий','<p class="muted">Расписание уточняется по официальной афише. Для синхронизации календаря потребуется панель администратора.</p>'+go('https://vk.com/krysha_ykt','Перейти к событиям')),
menu:()=>box('Меню ресторана','<p>Блюда, закуски, напитки и специальные предложения.</p><p class="muted">Полное актуальное меню и цены — на сайте заведения. Заказ через это приложение пока не подключён.</p>'+go('https://obchepitmedia.ru/krysha','Открыть меню')),
events:()=>box('Афиши «Крыши»','<p class="muted">Актуальные даты, программа и условия входа публикуются клубом. Регистрация через приложение пока не подключена.</p>'+go('https://vk.com/krysha_ykt','Афиши в VK')+' <button class="ghost" onclick="page(\'signup\')">Регистрация</button>'),
gallery:()=>box('Фотогалерея событий','<p class="muted">Переход к фотоальбомам сообщества VK. Встроенное отображение альбомов появится после подключения разрешённого VK API.</p>'+go('https://vk.com/albums-0','') .replace('href="https://vk.com/albums-0"','href="https://vk.com/krysha_ykt"').replace('></a>','>Фото в VK</a>')),
radio:()=>box('Радио КРЫША','<p class="muted">Здесь появятся DJ-сеты и эфир клуба. Пока аудиоплеер отключён: нужны разрешённые музыкальные записи и рекламные аудиоролики. Предусмотрены вставки рекламы каждые 15 минут воспроизведения.</p>'),
residents:()=>box('Резиденты клуба','<p class="muted">DJ, артисты и певцы будут добавлены после получения подтверждённого списка и согласованных фотографий.</p>'),
rules:()=>box('Правила клуба','<p>Уважайте других гостей, персонал и правила безопасности.</p><p class="notice">Во время мероприятий может вестись фото- и видеосъёмка. Клуб может публиковать репортажные материалы на своих площадках в пределах применимого закона. Для персональных публикаций, требующих согласия, оно оформляется отдельно.</p><p class="muted">Полный официальный регламент должен быть предоставлен администрацией клуба. Этот раздел пока ознакомительный.</p><label><input type="checkbox" id="agreed" style="display:inline;width:auto;min-height:auto" onchange="localStorage.setItem(\'krysha_rules\',this.checked)"> Я ознакомился с этой информацией</label>'),
booking:()=>box('Забронировать столик','<p>Чтобы забронировать стол, свяжитесь с администратором клуба.</p>'+call+'<p class="muted">Выбор столика и онлайн-подтверждение появятся после подключения базы бронирований.</p>'),
signup:()=>box('Регистрация на мероприятие','<p class="muted">Онлайн-регистрация пока не подключена. Напишите организаторам и уточните возможность участия.</p>'+go('https://vk.com/krysha_ykt','Связаться в VK')),
contacts:()=>box('Контакты','<p>Якутск, ул. Кальвица, 14/1а, 4 этаж.</p>'+call+'<div class="list"><a href="https://vk.com/krysha_ykt">VK</a><a href="https://t.me/krysha_ykt">Telegram</a><a href="https://instagram.com/krysha_ykt/">Instagram</a></div>'),
profile:()=>box('Мой кабинет','<p class="muted">Тестовая версия: данные не передаются администрации и хранятся только в этом браузере. Пароли не сохраняются, настоящая авторизация появится после подключения защищённого сервера.</p><label>Как к вам обращаться</label><input id="visitor" maxlength="80" placeholder="Ваше имя" value="'+safe(localStorage.getItem('krysha_visitor')||'')+'"><p><button class="btn" onclick="saveName()">Сохранить на устройстве</button></p>')+box('Бонусная карта · QR','<p class="muted">Персональный QR появится после подключения системы лояльности клуба.</p>')+box('Мои бронирования и мероприятия','<p class="muted">История станет доступна после подключения аккаунтов.</p>')+box('Отметки на фотографиях','<p class="muted">Добавим после согласования интеграции VK.</p>')+box('Обращение администрации','<p class="muted">Сообщения пока не отправляются через приложение. Для связи используйте VK или телефон.</p>'+go('https://vk.com/krysha_ykt','Написать клубу'))
};
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveName(){let e=document.getElementById('visitor');localStorage.setItem('krysha_visitor',e.value);alert('Имя сохранено на этом устройстве')}
function page(id){toggle(false);document.getElementById('view').innerHTML=pages[id]?pages[id]():pages.home();history.replaceState(null,'','#'+id);scrollTo(0,0);if(id==='rules'){document.getElementById('agreed').checked=localStorage.getItem('krysha_rules')==='true'}}
page(location.hash.slice(1)||'home');if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script></body></html>
